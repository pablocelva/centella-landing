    <line x1="260" y1="230" x2="260" y2="370"/>
    <line x1="300" y1="120" x2="300" y2="480"/>
    <line x1="340" y1="190" x2="340" y2="410"/>
    <line x1="380" y1="140" x2="380" y2="460"/>
    <line x1="420" y1="240" x2="420" y2="360"/>
    <line x1="460" y1="280" x2="460" y2="320"/>
